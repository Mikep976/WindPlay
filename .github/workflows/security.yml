name: Security regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.400
      - name: Check source trust boundaries
        run: python3 eng/security_gate.py
      - name: Locked restore
        run: dotnet restore tests/WindPlay.Protocol.Tests/WindPlay.Protocol.Tests.csproj --locked-mode
      - name: Full suite with bounded process runtime
        run: timeout 120s dotnet test tests/WindPlay.Protocol.Tests/WindPlay.Protocol.Tests.csproj -c Release --no-restore --logger 'trx;LogFileName=security.trx'
      - name: Dependency advisory gate
        run: python3 eng/audit_dependencies.py
      - name: Report dependency inventory
        run: python3 eng/dependency_sbom.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: security-evidence-only
          path: |
            tests/WindPlay.Protocol.Tests/TestResults/*.trx
            artifacts/security/*.json
          retention-days: 30
          if-no-files-found: warn

  windows-validation:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.400
      - name: Locked protocol restore
        run: dotnet restore tests/WindPlay.Protocol.Tests/WindPlay.Protocol.Tests.csproj --locked-mode
      - name: Full suite on Windows
        run: dotnet test tests/WindPlay.Protocol.Tests/WindPlay.Protocol.Tests.csproj -c Release --no-restore --logger 'trx;LogFileName=windows-security.trx'
      - name: Compile Windows UI for x64 validation only
        run: dotnet build src/WindPlay.App/WindPlay.App.csproj -c Release -p:Platform=x64 -p:PlatformTarget=x64 -p:RuntimeIdentifier=win-x64 -p:RestoreLockedMode=false
      - name: Audit application and test dependency graphs
        run: python eng/audit_dependencies.py src/WindPlay.App/WindPlay.App.csproj tests/WindPlay.Protocol.Tests/WindPlay.Protocol.Tests.csproj
      - name: MSVC native static analysis (x64 compile only)
        run: ./eng/analyze-native-codecs.ps1
      - name: Verify unsigned builds cannot pass publisher gate
        shell: pwsh
        run: |
          $binary = Get-ChildItem src/WindPlay.App/bin -Recurse -Filter WindPlay.exe | Select-Object -First 1
          if (-not $binary) { throw 'No x64 validation binary found.' }
          $rejected = $false
          try {
            ./eng/verify-release-signatures.ps1 -PublishDirectory $binary.DirectoryName -ExpectedCertificateSha256 ('0' * 64)
          } catch {
            if ($_.Exception.Message -notmatch 'no valid timestamped publisher signature') { throw }
            $rejected = $true
          }
          if (-not $rejected) { throw 'Unsigned output passed the release gate unexpectedly.' }
          Write-Output 'Unsigned output rejected as required.'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-security-evidence-only
          path: |
            tests/WindPlay.Protocol.Tests/TestResults/*.trx
            artifacts/security/*.json
          if-no-files-found: warn
