name: Build Windows ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Hold builds until every security release gate is cleared
        run: python eng/security_gate.py --release

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore WindPlay.slnx --locked-mode

      - name: Test protocol and security boundaries
        run: dotnet test tests/WindPlay.Protocol.Tests/WindPlay.Protocol.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=protocol-tests.trx"

      - name: Build bounded native audio codecs
        shell: pwsh
        run: ./eng/build-native-codecs.ps1

      - name: Build native ARM64 app
        run: dotnet build src/WindPlay.App/WindPlay.App.csproj -c Release -p:Platform=ARM64 --no-restore

      - name: Publish self-contained app
        run: dotnet publish src/WindPlay.App/WindPlay.App.csproj -c Release -p:Platform=ARM64 -r win-arm64 --self-contained true --no-restore -o artifacts/WindPlay

      - name: Verify ARM64 codecs and native initialization
        shell: pwsh
        run: ./eng/test-published-codecs.ps1 -PublishDirectory artifacts/WindPlay

      # Signing provisioning is deliberately not guessed or silently bypassed.
      # A release owner must configure signing before this workflow can publish.
      - name: Verify timestamped publisher signatures before packaging
        shell: pwsh
        env:
          WINDPLAY_EXPECTED_SIGNER_SHA256: ${{ vars.WINDPLAY_EXPECTED_SIGNER_SHA256 }}
        run: ./eng/verify-release-signatures.ps1 -PublishDirectory artifacts/WindPlay -ExpectedCertificateSha256 $env:WINDPLAY_EXPECTED_SIGNER_SHA256

      - name: Add quick-start note
        shell: pwsh
        run: Copy-Item docs/QUICKSTART.txt artifacts/WindPlay/START-HERE.txt

      - name: Create test ZIP
        shell: pwsh
        run: Compress-Archive -Path artifacts/WindPlay/* -DestinationPath artifacts/WindPlay-win-arm64.zip -CompressionLevel Optimal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: protocol-test-results
          path: tests/WindPlay.Protocol.Tests/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload WindPlay
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: WindPlay-win-arm64
          path: artifacts/WindPlay-win-arm64.zip
          if-no-files-found: error
          retention-days: 14
